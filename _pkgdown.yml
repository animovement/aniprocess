url: http://animovement.dev/aniprocess/
home:
  title: "aniprocess – An R toolbox for reading and writing movement data"

# Shared navbar (incl. the animovement dropdown + Zulip), theme, and author
# details are inherited from animovementtemplate.
template:
  bootstrap: 5
  package: animovementtemplate

reference:
- title: "Remove observations of poor quality"
  desc: These functions ensure that your data is ready for analysis.
  contents:
  - filter_na_across
  - filter_na_with
  - filter_na_confidence
  - filter_na_excursion
  - filter_na_range
  - filter_na_roi
  - filter_na_speed

- title: "Interpolate over missing values"
  desc: These functions ensure that your data is ready for analysis.
  contents:
  - replace_na_across
  - replace_na_with
  - replace_na_linear
  - replace_na_locf
  - replace_na_spline
  - replace_na_stine
  - replace_na_value

- title: "Smoothing/filtering functions"
  desc: These functions ensure that your data is ready for analysis.
  contents:
  - filter_across
  - filter_with
  - filter_ccma
  - filter_gaussian
  - filter_highpass
  - filter_highpass_fft
  - filter_kalman
  - filter_kalman_irregular
  - filter_lowpass
  - filter_lowpass_fft
  - filter_rollmean
  - filter_rollmedian
  - filter_sgolay
  - filter_triangular

- title: "Other functions"
  desc: These functions ensure that your data is ready for analysis.
  contents:
  - find_peaks
  - find_troughs
