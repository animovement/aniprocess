url: https://animovement.dev/aniprocess/
home:
  title: "aniprocess – signal processing and filtering for movement data"

# Shared navbar (incl. the animovement dropdown + Zulip), theme, and author
# details are inherited from animovementtemplate.
template:
  bootstrap: 5
  package: animovementtemplate
  bslib:
    primary: "#FFBB44"
    # The hue itself is too light for body text on white.
    link_color: "#966E28"

reference:
- title: "Work on a whole aniframe"
  desc: Apply a named method across the spatial columns, within groups.
  contents:
  - filter_across
  - mask_na_across
  - replace_na_across

- title: "Choose a method by name"
  desc: The same, for a vector or a frame of coordinates inside `mutate()`.
  contents:
  - filter_with
  - mask_na_with
  - replace_na_with

- title: "Mask unreliable observations"
  desc: Replace values that fail a quality criterion with `NA`.
  contents:
  - mask_na_confidence
  - mask_na_excursion
  - mask_na_hampel
  - mask_na_range
  - mask_na_roi
  - mask_na_segment_length
  - mask_na_speed

- title: "Fill missing values"
  desc: Fill gaps by interpolation, carrying forward, or a constant.
  contents:
  - replace_na_linear
  - replace_na_locf
  - replace_na_spline
  - replace_na_stine
  - replace_na_value

- title: "Smooth and filter signals"
  desc: Suppress noise while preserving the movement you care about.
  contents:
  - filter_ccma
  - filter_deadband
  - filter_gaussian
  - filter_highpass
  - filter_highpass_fft
  - filter_kalman
  - filter_kalman_irregular
  - filter_lowpass
  - filter_lowpass_fft
  - filter_one_euro
  - filter_rollmean
  - filter_rollmedian
  - filter_sgolay
  - filter_triangular

- title: "Find peaks and troughs"
  desc: Locate local extrema by height, prominence and plateau handling.
  contents:
  - find_peaks
  - find_troughs
